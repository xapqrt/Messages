[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbguy"
version = "0.1.0"
description = "Authorized bug-bounty scope authority, recon ledger and proof bundles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "idna>=3.7,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "coverage>=7,<8",
]

[project.scripts]
bbguy = "bbguy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bbguy = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "traffic: needs a lab or public target; skipped without BBGUY_LAB",
  "cfg: deterministic configuration test; no target traffic",
]

[tool.coverage.run]
source = ["bbguy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
